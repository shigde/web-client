<div class="d-flex flex-column flex-shrink-0 p-3" style="width: 280px;">
  <div class="d-flex flex-column align-items-center">
    <a href="/" class="text-decoration-none">
      <app-avatar size="60" name="{{ (user$ | async)?.name }}"></app-avatar>
    </a>

    <a href="/" class="text-decoration-none mt-2">{{ (user$ | async)?.domainName }}</a>

  </div>

  <hr>
  <ul class="nav nav-pills flex-column mb-auto">

    <li class="nav-item">
      <a href="/channel/{{(user$ | async)?.channel_uuid}}" class="dropdown-item" aria-current="page"><i class="bi bi-house  me-3"></i>My Channel</a>
    </li>
    <li class="nav-item">
      <a href="/settings" class="dropdown-item" aria-current="page"><i class="bi bi-gear  me-3"></i>Settings</a>
    </li>

    @if (isAdmin$ | async) {
      <li class="nav-item mt-2">
        <h6 class="dropdown-header admin-heading">Admin</h6>
        <a routerLink="/admin/monitoring" class="dropdown-item ps-5">
          <i class="bi bi-activity me-3" aria-hidden="true"></i>Monitoring
        </a>
      </li>
    }

    <li>
      <hr class="dropdown-divider">
    </li>

    <li class="nav-item">
      <a href="#" class="dropdown-item" aria-current="page" (click)="logout()"><i
        class="bi bi-box-arrow-in-right  me-3"></i><b>Sing out</b></a>
    </li>

    <li>
      <hr class="dropdown-divider">
    </li>

    <li class="nav-item">
      <a href="#" class="dropdown-item" aria-current="page"><i class="bi bi-question-circle  me-3"></i>Help</a>
    </li>
    <li class="nav-item">
      <a href="#" class="dropdown-item" aria-current="page"><i class="bi bi-chat-left-heart  me-3"></i>Send Feedback</a>
    </li>
  </ul>

</div>
