<header class="p-3 border-bottom bg-body">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-start">
      <a href="#" class="d-flex align-items-center  link-body-emphasis text-decoration-none nav col-auto col-lg-auto me-auto">
        <img width="40" alt="Shig Logo" src="assets/icons/logo.png"/>
        <ul class="nav">
          <li class="px-2"><span>Shig</span></li>
        </ul>
      </a>


      <!--      <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">-->
      <!--        <input type="search" class="form-control" placeholder="Search..." aria-label="Search">-->
      <!--      </form>-->


      <div class="mb-0 me-3" *ngIf="(isUserLogin$ | async) == true">
        <button type="button" class="btn btn-outline-primary me-2" (click)="newStream()">
          <i class="bi bi-plus-circle-fill bi-border me-0 me-sm-2"></i>
          <span class="d-none d-sm-inline-block">New Stream</span>
        </button>
      </div>
      @if ((isUserLogin$ | async) === true) {
        <div class="position-relative me-4" (click)="$event.stopPropagation()">
          <button type="button" class="btn border-0 p-0 position-relative link-body-emphasis fs-4" aria-label="Notifications" aria-controls="notification-inbox" [attr.aria-expanded]="notificationsOpen" (click)="notificationsOpen = !notificationsOpen">
            <i class="bi bi-bell" aria-hidden="true"></i>
            @if ((notificationCounts$ | async)?.unread; as count) { <span class="position-absolute alert-circle translate-middle p-1 bg-danger border border-light rounded-circle"><span class="visually-hidden">{{ count }} unread notifications</span></span> }
          </button>
          @if (notificationsOpen) {
            <section id="notification-inbox" class="notification-inbox card shadow p-3" aria-label="Notifications">
              <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Notifications</h2><button type="button" class="btn-close" aria-label="Close notifications" (click)="notificationsOpen = false"></button></div>
              <app-inbox-list kind="notifications" (opened)="notificationsOpen = false" />
            </section>
          }
        </div>
        <a routerLink="/messages" class="nav-link position-relative d-block link-body-emphasis fs-4 me-4" aria-label="Messages" (click)="notificationsOpen = false">
          <i class="bi bi-inbox" aria-hidden="true"></i>
          @if ((messageCounts$ | async)?.unread; as count) { <span class="position-absolute alert-circle translate-middle p-1 bg-danger border border-light rounded-circle"><span class="visually-hidden">{{ count }} unread messages</span></span> }
        </a>
      }
      <div class="dropdown text-end" *ngIf="(isUserLogin$ | async) == true">
        <a href="#" class="nav-link d-block link-body-emphasis text-decoration-none dropdown-toggle"
           data-bs-toggle="dropdown" aria-expanded="false" data-bs-offset="-50,-50">
          <i class="bi bi-person-circle fs-2 mb-0"></i>
        </a>
        <app-sidebar class="dropdown-menu"  ></app-sidebar>
      </div>


      <div class="col-md-3 text-end" *ngIf="(isUserLogin$ | async) == false">
        <a type="button" class="btn btn-outline-primary me-2" href="/login">Login</a>
        <a type="button" class="btn btn-primary" href="/signup">Sign-up</a>
      </div>


    </div>
  </div>
</header>
