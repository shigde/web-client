name: Deploy Web Client

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: deploy-web-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      SHIG_API_PREFIX: ${{ vars.SHIG_API_PREFIX || '/api' }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
      SHIG_RELAY_SERVICE: ${{ vars.SHIG_RELAY_SERVICE || 'https://localhost:4443' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.JS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime config
        run: npm run generate-env

      - name: Build web client
        run: npm run build

      - name: Resolve build output directory
        id: build-output
        shell: bash
        run: |
          if [ -d "dist/web-client/browser" ]; then
            echo "dir=dist/web-client/browser" >> "$GITHUB_OUTPUT"
          elif [ -d "dist/web-client" ]; then
            echo "dir=dist/web-client" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find Angular build output directory." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/server_deploy_key
          chmod 600 ~/.ssh/server_deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/server_deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$SERVER_TARGET_DIR'"

      - name: Deploy to server
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/server_deploy_key -p $SERVER_PORT" \
            "${{ steps.build-output.outputs.dir }}/" \
            "$SERVER_USER@$SERVER_HOST:$SERVER_TARGET_DIR/"
